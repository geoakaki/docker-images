name: build

# Builds every image for linux/amd64 + linux/arm64 and pushes it to
# ghcr.io/<owner>/docker-images/<image>:{latest,<version>}. A push to main rebuilds only the images whose folder
# changed; a manual run rebuilds all of them.
on:
  push:
    branches: [main]
    paths: ['buildkit/**', 'rancher/**', 'ansible/**', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # version = the main tool's version, kept in step with the Dockerfile ARG defaults
          - image: buildkit
            version: v0.33.1
          - image: rancher
            version: v2.15.2
          - image: ansible
            version: 14.5.0
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Changed?
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             || git diff --name-only HEAD~1 HEAD | grep -qE '^(${{ matrix.image }}/|\.github/workflows/build\.yml)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
        if: steps.changed.outputs.build == 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.changed.outputs.build == 'true'

      - uses: docker/login-action@v3
        if: steps.changed.outputs.build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: steps.changed.outputs.build == 'true'
        with:
          context: ${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/docker-images/${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/docker-images/${{ matrix.image }}:${{ matrix.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
